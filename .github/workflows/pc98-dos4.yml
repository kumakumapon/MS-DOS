name: PC-98 MS-DOS 4.0
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: dos
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kumakumapon/webnp2
          ref: 4c21552727cfe4019b4dc0f68f0dca124026f650
          path: webnp2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y dosbox qemu-system-x86
      - run: python3 ports/pc98/toolchain.py
        working-directory: dos
      - run: |
          python3 ports/pc98/dos4.py --dosbox /usr/bin/dosbox --jwasm .work/pc98-tools/JWasm/GccUnixR/jwasm
          python3 -m unittest discover -s ports/pc98 -p 'test_*.py'
          python3 -m unittest discover -s tools/dos4 -p 'test_*.py'
          make -C tools/filer test
          make -C tools/editor test
          python3 tools/filer/verify_ibm.py
        working-directory: dos
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - run: npm ci
        working-directory: webnp2
      - run: |
          mkdir -p webnp2/public/test
          cp dos/ports/pc98/build/dos4/msdos4-pc98.xdf webnp2/public/test/msdos4-pc98-ci.xdf
          npm --prefix webnp2 run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/webnp2.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          DOS_VERSION=4 CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/ports/pc98/verify-webnp2.mjs webnp2 msdos4-pc98-ci.xdf dos/ports/pc98/build/dos4/validation
          cp dos/ports/pc98/build/dos4/msdos4-pc98.xdf webnp2/public/test/dos4-filer.xdf
          CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/tools/filer/verify-webnp2.mjs webnp2 http://127.0.0.1:5173/ dos/tools/filer/build/pc98-validation
          cp dos/ports/pc98/build/dos4/msdos4-pc98.xdf webnp2/public/test/dos4-editor.xdf
          CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/tools/editor/verify-webnp2.mjs webnp2 http://127.0.0.1:5173/ dos/tools/editor/build/pc98-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msdos4-pc98
          path: |
            dos/ports/pc98/build/dos4
            dos/tools/filer/build
            dos/tools/editor/build
            dos/.work/pc98-dos4/checkpoint.json
            dos/.work/pc98-dos4/v4.0/src/BUILD.LOG

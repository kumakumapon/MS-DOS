name: PC-98 MS-DOS 4.0
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: dos
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: kumakumapon/webnp2
          ref: f4b39f73972b620444c079206dc9e4085804a843
          path: webnp2
          fetch-depth: 0
      - name: Require the pinned emulator to remain on master history
        run: git -C webnp2 merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use HTTPS for Ubuntu sources and actual mirror lists
        timeout-minutes: 1
        run: sudo python3 dos/.github/scripts/apt-https.py
      - name: Install PC-98 build and validation dependencies
        timeout-minutes: 4
        run: |
          sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=0 update
          sudo apt-get -o Acquire::Retries=0 install -y dosbox qemu-system-x86
      - timeout-minutes: 4
        run: python3 ports/pc98/toolchain.py
        working-directory: dos
      - timeout-minutes: 10
        run: |
          python3 ports/pc98/dos4.py --dosbox /usr/bin/dosbox --jwasm .work/pc98-tools/JWasm/GccUnixR/jwasm
          python3 ports/pc98/hdd/oem.py --dosbox /usr/bin/dosbox --jwasm .work/pc98-tools/JWasm/GccUnixR/jwasm
          python3 -m unittest discover -s ports/pc98 -p 'test_*.py'
          python3 -m unittest discover -s tools/dos4 -p 'test_*.py'
          python3 -m unittest discover -s tools/mz -p 'test_*.py'
          make -C tools/filer test
          make -C tools/editor test
          make -C tools/window test
          make -C tools/k386 all test
          make -C tools/k38632 all test
          make -C tools/kgui32 all test
          make -C tools/display all
          make -C ports/pc98/hdd all test
          python3 tools/filer/verify_ibm.py
        working-directory: dos
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - timeout-minutes: 3
        run: npm ci
        working-directory: webnp2
      - timeout-minutes: 10
        run: |
          mkdir -p webnp2/public/test
          cp dos/ports/pc98/build/dos4/msdos4-pc98.xdf webnp2/public/test/msdos4-pc98-ci.xdf
          (cd webnp2 && exec node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort) > /tmp/webnp2.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:5173/ > /dev/null; do sleep 1; done'
          DOS_VERSION=4 CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/ports/pc98/verify-webnp2.mjs webnp2 msdos4-pc98-ci.xdf dos/ports/pc98/build/dos4/validation
          cp dos/ports/pc98/build/dos4/msdos4-pc98.xdf webnp2/public/test/dos4-filer.xdf
          CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/tools/filer/verify-webnp2.mjs webnp2 http://127.0.0.1:5173/ dos/tools/filer/build/pc98-validation
          cp dos/ports/pc98/build/dos4/msdos4-pc98.xdf webnp2/public/test/dos4-editor.xdf
          CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/tools/editor/verify-webnp2.mjs webnp2 http://127.0.0.1:5173/ dos/tools/editor/build/pc98-validation
          cp dos/ports/pc98/build/dos4/msdos4-pc98.xdf webnp2/public/test/dos4-window.xdf
          CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/tools/window/verify-webnp2.mjs webnp2 http://127.0.0.1:5173/ dos/tools/window/build/pc98-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: msdos4-pc98
          path: |
            dos/ports/pc98/build/dos4
            dos/tools/filer/build
            dos/tools/editor/build
            dos/tools/control/build
            dos/tools/window/build
            dos/tools/k386/build
            dos/tools/k38632/build
            dos/tools/kgui32/build
            dos/tools/kvideo/build
            dos/tools/kproc/build
            dos/ports/pc98/hdd/build
            dos/.work/pc98-dos4/checkpoint.json
            dos/.work/pc98-dos4/v4.0/src/BUILD.LOG

name: PC-98 MS-DOS 2.0
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: dos
      - uses: actions/checkout@v4
        with:
          repository: kumakumapon/webnp2
          ref: dde99e952664e0a8b64d716ec98ac6ea75961eb6
          path: webnp2
          fetch-depth: 0
      - name: Require the pinned emulator to remain on master history
        run: git -C webnp2 merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use HTTPS for Ubuntu sources and actual mirror lists
        timeout-minutes: 1
        run: sudo python3 dos/.github/scripts/apt-https.py
      - timeout-minutes: 4
        run: python3 ports/pc98/toolchain.py
        working-directory: dos
      - timeout-minutes: 10
        run: |
          python3 ports/pc98/build.py --jwasm .work/pc98-tools/JWasm/GccUnixR/jwasm --jwlink .work/pc98-tools/JWlink/build/jwlinkLR/jwlink
          python3 ports/pc98/image.py
          python3 -m unittest discover -s ports/pc98 -p 'test_*.py'
        working-directory: dos
      - timeout-minutes: 3
        run: npm ci
        working-directory: webnp2
      - timeout-minutes: 10
        run: |
          mkdir -p webnp2/public/test
          cp dos/ports/pc98/build/msdos2-pc98.xdf webnp2/public/test/msdos2-pc98-ci.xdf
          npm --prefix webnp2 run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/webnp2.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:5173/ > /dev/null; do sleep 1; done'
          CHROMIUM=/usr/bin/google-chrome WEBNP2_NO_SANDBOX=1 node dos/ports/pc98/verify-webnp2.mjs webnp2 msdos2-pc98-ci.xdf dos/ports/pc98/build/validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          overwrite: true
          name: msdos2-pc98
          path: dos/ports/pc98/build
